<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    /* Black mark by default; flips to white so it stays visible on dark tab strips. */
    .mark { stroke: #000; }
    .peak { fill: #000; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #fff; }
      .peak { fill: #fff; }
    }
  </style>
  <path class="mark" d="M4 24 12 16 18 21 26 10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="peak" cx="26" cy="10" r="3.4"/>
</svg>
